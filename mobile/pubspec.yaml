name: network_doctor
description: "Network Doctor - scan your Wi-Fi network and view the Network Doctor PC monitor."
publish_to: 'none'
version: 1.6.0+8

environment:
  sdk: ">=3.4.0 <4.0.0"

# Package versions are added by the "Mobile - bootstrap" workflow with `flutter pub add`
# so they always match the current Flutter release.
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  network_info_plus: ^8.2.2
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
