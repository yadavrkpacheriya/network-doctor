name: Pro build (private)

# Builds the PRIVATE Pro edition of Network Doctor - with auto-defense, remote, packet capture,
# vulnerability checks, accounts and the audit log. It is uploaded only as a workflow ARTIFACT (visible to
# repo collaborators), never attached to a public release and never shipped to Google Play or the Microsoft
# Store. Run it from the Actions tab (Run workflow) or it runs on a push to a pro-* branch.

on:
  push:
    branches: ["pro-*", "pro-security"]
    paths: ["desktop/**", ".github/workflows/pro-build.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests (incl. Pro)
        env:
          ND_EDITION: pro
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller scapy pillow
          python -m unittest discover -s tests
      - name: Build NetworkDoctor-Pro.exe
        shell: pwsh
        env:
          ND_EDITION: pro
        run: |
          "" | Out-File -Encoding ascii pro_edition.txt   # the marker that turns Pro on at runtime
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name NetworkDoctor-Pro --icon store/NetworkDoctor.ico `
            --add-data "pro_edition.txt;." `
            --hidden-import nd_core --hidden-import nd_monitor --hidden-import nd_update --hidden-import nd_share --hidden-import nd_tools --hidden-import nd_tabs --hidden-import nd_net --hidden-import nd_toolstab --hidden-import nd_snmp --hidden-import nd_plugins --hidden-import nd_linux --hidden-import nd_dnsfilter --hidden-import nd_routeros --hidden-import nd_usage --hidden-import nd_home --hidden-import nd_slow --hidden-import nd_smbinfo --hidden-import nd_alerts --hidden-import nd_auth --hidden-import nd_defense --hidden-import nd_protab --hidden-import nd_vuln --hidden-import nd_capture --hidden-import nd_expose `
            --collect-all scapy NetworkDoctor.py
          if (-not (Test-Path dist\NetworkDoctor-Pro.exe)) { Write-Error "Pro exe not produced"; exit 1 }
          $h = (Get-FileHash dist\NetworkDoctor-Pro.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\dist\NetworkDoctor-Pro.exe.sha256", "$h  NetworkDoctor-Pro.exe")
      - name: Self-test every page (Pro)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\NetworkDoctor-Pro.exe -ArgumentList '--selftest', "$PWD\pro-screens" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error "self-test hung" }
          Get-Content pro-screens\selftest.txt
          if ($p.ExitCode -ne 0) { Write-Error "Pro self-test reported errors" }
      - name: Upload the private Pro build (artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: NetworkDoctor-Pro-windows
          path: |
            desktop/dist/NetworkDoctor-Pro.exe
            desktop/dist/NetworkDoctor-Pro.exe.sha256
      - name: Upload Pro screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-screens
          path: desktop/pro-screens
