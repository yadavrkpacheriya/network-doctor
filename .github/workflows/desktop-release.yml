name: Desktop - build and release

# A new release is made automatically whenever VERSION in desktop/NetworkDoctor.py
# is changed to a number that has not been released yet. No server is needed:
# GitHub builds the exe on a free Windows machine and every installed copy of
# Network Doctor picks the new version up through its built-in updater.

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      exists: ${{ steps.ver.outputs.exists }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check if it is already released
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path NetworkDoctor.py -Pattern '^VERSION = "([0-9]+(\.[0-9]+)*)"'
          if (-not $m) { Write-Error "VERSION line not found in NetworkDoctor.py"; exit 1 }
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v already released - nothing to do" }
          else { "exists=false" >> $env:GITHUB_OUTPUT; Write-Host "Building new release v$v" }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Install build tools
        if: steps.ver.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller scapy

      - name: Check that the code loads
        if: steps.ver.outputs.exists == 'false'
        run: |
          python -c "import nd_core, nd_monitor, nd_update, nd_tools, nd_tabs, nd_net, nd_toolstab, nd_snmp, nd_plugins, nd_linux, nd_dnsfilter, nd_routeros, nd_usage, nd_home, nd_slow, nd_smbinfo, nd_alerts, NetworkDoctor; print('modules OK', NetworkDoctor.VERSION)"
          python -m unittest discover -s tests -v

      - name: Build NetworkDoctor.exe
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $extra = @()
          if (Test-Path nd_share.py) { $extra += @("--hidden-import", "nd_share") }
          python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name NetworkDoctor --icon store/NetworkDoctor.ico `
            --hidden-import nd_core --hidden-import nd_monitor --hidden-import nd_update --hidden-import nd_tools --hidden-import nd_tabs --hidden-import nd_net --hidden-import nd_toolstab --hidden-import nd_snmp --hidden-import nd_plugins --hidden-import nd_linux --hidden-import nd_dnsfilter --hidden-import nd_routeros --hidden-import nd_usage --hidden-import nd_home --hidden-import nd_slow --hidden-import nd_smbinfo --hidden-import nd_alerts --hidden-import nd_auth --hidden-import nd_defense --hidden-import nd_vuln --hidden-import nd_capture --hidden-import nd_expose --hidden-import nd_protab --hidden-import nd_license @extra `
            --collect-all scapy NetworkDoctor.py
          if (-not (Test-Path dist\NetworkDoctor.exe)) { Write-Error "exe was not produced"; exit 1 }

      - name: Build the Microsoft Store package (NetworkDoctor-Store.msix)
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          # Store apps start as a normal user (no --uac-admin) and are updated by the Store, not by themselves
          pip install pillow
          python -m PyInstaller --noconfirm --onefile --windowed --name NetworkDoctor --icon store/NetworkDoctor.ico --distpath dist-store --workpath build-store `
            --hidden-import nd_core --hidden-import nd_monitor --hidden-import nd_update --hidden-import nd_tools --hidden-import nd_tabs --hidden-import nd_net --hidden-import nd_toolstab --hidden-import nd_snmp --hidden-import nd_plugins --hidden-import nd_linux --hidden-import nd_dnsfilter --hidden-import nd_routeros --hidden-import nd_usage --hidden-import nd_home --hidden-import nd_slow --hidden-import nd_smbinfo --hidden-import nd_alerts --hidden-import nd_auth --hidden-import nd_defense --hidden-import nd_vuln --hidden-import nd_capture --hidden-import nd_expose --hidden-import nd_protab --hidden-import nd_license --hidden-import nd_share `
            --collect-all scapy NetworkDoctor.py
          ./store/build_msix.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: Checksum
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\NetworkDoctor.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\dist\NetworkDoctor.exe.sha256", "$h  NetworkDoctor.exe")
          Write-Host "SHA-256: $h"

      - name: Publish GitHub Release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Network Doctor ${{ steps.ver.outputs.version }}
          body_path: desktop/RELEASE_NOTES.md
          make_latest: true
          files: |
            desktop/dist/NetworkDoctor.exe
            desktop/dist/NetworkDoctor.exe.sha256
            desktop/dist/NetworkDoctor-Store.msix

  # Linux app (x86-64). Built on the oldest supported Ubuntu so it also runs on older distributions.
  linux:
    needs: windows
    if: needs.windows.outputs.exists == 'false'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller scapy
          # The Tk GUI toolkit's shared libraries (libtk8.6.so / libtcl8.6.so) are not on this image by
          # default. PyInstaller only bundles what it can find and load at BUILD time, so without this the
          # build still "succeeds" but silently ships a binary that fails at startup on every machine with
          # "ImportError: libtk8.6.so: cannot open shared object file" (3.23.1's real-world failure).
          # xvfb: a virtual display so the GUI can actually be launched and smoke-tested below, headless.
          sudo apt-get update -y
          sudo apt-get install -y python3-tk xvfb

      - name: Check that the code loads
        run: |
          python -c "import tkinter; print('tkinter OK', tkinter.TkVersion)"
          python -c "import nd_core, nd_monitor, nd_update, nd_share, nd_tools, nd_tabs, nd_net, nd_toolstab, nd_snmp, nd_plugins, nd_linux, nd_dnsfilter, nd_routeros, nd_usage, nd_home, nd_slow, nd_smbinfo, nd_alerts; print('modules OK')"
          python -m unittest discover -s tests -v

      - name: "Locate Tcl/Tk's shared libraries (to force-bundle them below - PyInstaller's own tkinter hook silently skipped them in 3.23.1/3.23.2)"
        run: |
          TCL_LIB="$(ldconfig -p | awk '/libtcl8\.6\.so /{print $NF; exit}')"
          TK_LIB="$(ldconfig -p | awk '/libtk8\.6\.so /{print $NF; exit}')"
          test -f "$TCL_LIB" || { echo "::error::could not locate libtcl8.6.so via ldconfig"; exit 1; }
          test -f "$TK_LIB" || { echo "::error::could not locate libtk8.6.so via ldconfig"; exit 1; }
          echo "TCL_LIB=$TCL_LIB" >> "$GITHUB_ENV"
          echo "TK_LIB=$TK_LIB" >> "$GITHUB_ENV"
          echo "Found: $TCL_LIB and $TK_LIB"

      - name: Build NetworkDoctor-Linux (portable, onefile - self-updates in place, no setcap)
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name NetworkDoctor \
            --add-binary "$TCL_LIB:." --add-binary "$TK_LIB:." \
            --hidden-import nd_core --hidden-import nd_monitor --hidden-import nd_update --hidden-import nd_share --hidden-import nd_tools --hidden-import nd_tabs --hidden-import nd_net --hidden-import nd_toolstab --hidden-import nd_snmp --hidden-import nd_plugins --hidden-import nd_linux --hidden-import nd_dnsfilter --hidden-import nd_routeros --hidden-import nd_usage --hidden-import nd_home --hidden-import nd_slow --hidden-import nd_smbinfo --hidden-import nd_alerts --hidden-import nd_auth --hidden-import nd_defense --hidden-import nd_vuln --hidden-import nd_capture --hidden-import nd_expose --hidden-import nd_protab --hidden-import nd_license --hidden-import nd_arpblock \
            --collect-all scapy NetworkDoctor.py
          mv dist/NetworkDoctor dist/NetworkDoctor-Linux
          chmod +x dist/NetworkDoctor-Linux
          (cd dist && sha256sum NetworkDoctor-Linux > NetworkDoctor-Linux.sha256 && cat NetworkDoctor-Linux.sha256)

      - name: "Build the .deb payload (onedir, not onefile - setcap on a onefile binary breaks PyInstaller's own /proc self-check, see linux/build_deb.sh)"
        run: |
          python -m PyInstaller --noconfirm --onedir --windowed --name NetworkDoctor --distpath dist-deb --workpath build-deb \
            --add-binary "$TCL_LIB:." --add-binary "$TK_LIB:." \
            --hidden-import nd_core --hidden-import nd_monitor --hidden-import nd_update --hidden-import nd_share --hidden-import nd_tools --hidden-import nd_tabs --hidden-import nd_net --hidden-import nd_toolstab --hidden-import nd_snmp --hidden-import nd_plugins --hidden-import nd_linux --hidden-import nd_dnsfilter --hidden-import nd_routeros --hidden-import nd_usage --hidden-import nd_home --hidden-import nd_slow --hidden-import nd_smbinfo --hidden-import nd_alerts --hidden-import nd_auth --hidden-import nd_defense --hidden-import nd_vuln --hidden-import nd_capture --hidden-import nd_expose --hidden-import nd_protab --hidden-import nd_license --hidden-import nd_arpblock \
            --collect-all scapy NetworkDoctor.py

      - name: "Co-locate Tcl/Tk next to _tkinter's own extension module (onedir can nest it below the top level, where --add-binary's '.' destination and _tkinter's own $ORIGIN rpath don't meet - the real cause of the libtk8.6.so crash on a real machine)"
        run: |
          TKINTER_SO="$(find dist-deb/NetworkDoctor -name '_tkinter*.so' | head -1)"
          test -n "$TKINTER_SO" || { echo "::error::_tkinter*.so was not found anywhere in the onedir build - tkinter wasn't bundled at all"; exit 1; }
          DEST_DIR="$(dirname "$TKINTER_SO")"
          echo "_tkinter lives at: $TKINTER_SO - copying Tcl/Tk into its own directory: $DEST_DIR"
          cp -v "$TCL_LIB" "$DEST_DIR/"
          cp -v "$TK_LIB" "$DEST_DIR/"

      - name: "Remove the build machine's own Tcl/Tk (so the checks below can only pass using what's actually bundled, not a system copy that masks a missing one - this masking is exactly how 3.23.1/3.23.2 slipped through CI and still failed on real machines)"
        run: |
          sudo apt-get purge -y python3-tk tcl8.6 tk8.6
          sudo apt-get autoremove -y
          sudo ldconfig
          # actions/setup-python sets LD_LIBRARY_PATH to its own hosted Python's lib/ dir for the WHOLE job
          # (visible in every step's env above) - that's a self-contained python-build-standalone install,
          # not an apt package, so the purge above never touches it. It carries its own libtcl8.6.so/
          # libtk8.6.so, which was silently satisfying every check below regardless of whether PyInstaller
          # actually bundled them (3.23.4's real bug, despite this exact job reporting every check green).
          # Clearing it for the rest of the job is what finally makes those checks mean something.
          echo "setup-python's own lib dir ($pythonLocation/lib) - checking in case it also masks the bundle:"
          ls "$pythonLocation/lib" 2>/dev/null | grep -iE 'tcl|tk' || echo "(nothing matched)"
          echo "LD_LIBRARY_PATH=" >> "$GITHUB_ENV"
          # apt purge alone isn't always enough: a stray copy outside dpkg's own tracked paths (seen once on
          # this runner image, cause unconfirmed) can survive the purge and still show up in ldconfig's
          # cache. If anything still resolves after the purge, delete those exact files directly and refresh
          # the cache again, so the checks below can't be fooled a second way.
          remaining="$(ldconfig -p | grep -iE 'libtcl8\.6\.so |libtk8\.6\.so ' || true)"
          if [ -n "$remaining" ]; then
            echo "Still present after apt purge - removing the files directly:"
            echo "$remaining"
            echo "$remaining" | awk '{print $NF}' | sudo xargs -r rm -fv
            sudo ldconfig
            remaining="$(ldconfig -p | grep -iE 'libtcl8\.6\.so |libtk8\.6\.so ' || true)"
          fi
          if [ -n "$remaining" ]; then
            echo "$remaining"
            echo "::error::Could not remove the system Tcl/Tk libraries - later checks would still be unreliable"
            exit 1
          fi
          echo "Confirmed: no system-wide libtcl8.6.so/libtk8.6.so remain"

      - name: "Verify the required libraries are actually inside the bundle, by filename, not just resolvable (ldd alone can be fooled by a leftover system copy)"
        run: |
          for pattern in 'libtcl8.6.so*' 'libtk8.6.so*'; do
            found="$(find dist/NetworkDoctor-Linux dist-deb/NetworkDoctor -iname "$pattern" 2>/dev/null | head -1)"
            test -n "$found" || { echo "::error::$pattern was not bundled into the build - PyInstaller's --add-binary did not take effect"; exit 1; }
            echo "OK - $found"
          done

      - name: "Verify no bundled library is missing (would have caught 3.23.1's libtk8.6.so bug)"
        run: |
          missing=$(find dist-deb/NetworkDoctor -type f \( -name "*.so*" -o -perm -u+x \) -exec sh -c \
            'ldd "$1" 2>/dev/null | grep "not found"' _ {} \;)
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "::error::A bundled binary is missing a shared library - the Linux build would not run."
            exit 1
          fi
          echo "OK - every bundled binary resolves its shared libraries"

      - name: "Smoke-test the portable build (actually launches the GUI, headless - catches a build that 'succeeds' but can't run, now with the system's own Tcl/Tk removed so this can't be masked)"
        timeout-minutes: 5
        run: |
          rm -rf /tmp/selftest-onefile
          xvfb-run -a dist/NetworkDoctor-Linux --selftest /tmp/selftest-onefile || {
            echo "::error::NetworkDoctor-Linux failed its self-test - see selftest.txt below"
            cat /tmp/selftest-onefile/selftest.txt 2>/dev/null
            exit 1
          }
          cat /tmp/selftest-onefile/selftest.txt

      - name: "Build the .deb package (proper install - app menu, icon, autostart-ready, setcap)"
        run: |
          chmod +x linux/build_deb.sh
          ./linux/build_deb.sh dist-deb/NetworkDoctor "${{ needs.windows.outputs.version }}" \
            ../mobile/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            "dist/NetworkDoctor_${{ needs.windows.outputs.version }}_amd64.deb"
          (cd dist && sha256sum "NetworkDoctor_${{ needs.windows.outputs.version }}_amd64.deb" \
            > "NetworkDoctor_${{ needs.windows.outputs.version }}_amd64.deb.sha256")

      - name: "Install the .deb for real and smoke-test it (exactly what a user's machine does - postinst, setcap, the works)"
        timeout-minutes: 5
        run: |
          sudo apt-get install -y "./dist/NetworkDoctor_${{ needs.windows.outputs.version }}_amd64.deb"
          test -x /opt/networkdoctor/NetworkDoctor
          getcap /opt/networkdoctor/NetworkDoctor | grep -q cap_net_raw || \
            echo "::warning::setcap did not apply (libcap2-bin missing?) - raw-socket tests will need sudo on a real machine too"
          rm -rf /tmp/selftest-deb
          xvfb-run -a /opt/networkdoctor/NetworkDoctor --selftest /tmp/selftest-deb || {
            echo "::error::The installed .deb failed its self-test - see selftest.txt below"
            cat /tmp/selftest-deb/selftest.txt 2>/dev/null
            exit 1
          }
          cat /tmp/selftest-deb/selftest.txt
          sudo apt-get remove -y networkdoctor

      - name: Add the Linux app to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v${{ needs.windows.outputs.version }}" \
            dist/NetworkDoctor-Linux dist/NetworkDoctor-Linux.sha256 \
            "dist/NetworkDoctor_${{ needs.windows.outputs.version }}_amd64.deb" \
            "dist/NetworkDoctor_${{ needs.windows.outputs.version }}_amd64.deb.sha256" \
            --repo "${{ github.repository }}" --clobber
