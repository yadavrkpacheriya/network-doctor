<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 576" width="900" height="576" font-family="Segoe UI, Arial, sans-serif">
<rect width="900" height="576" fill="#ffffff"/>
<defs><marker id="ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/></marker></defs>
<line x1="280" y1="55" x2="330" y2="55" stroke="#15803d" stroke-width="2.4" marker-end="url(#ok)"/>
<line x1="455" y1="90" x2="455" y2="150" stroke="#15803d" stroke-width="2.4" marker-end="url(#ok)"/>
<line x1="455" y1="236" x2="455" y2="290" stroke="#15803d" stroke-width="2.4" marker-end="url(#ok)"/>
<line x1="330" y1="338" x2="290" y2="412" stroke="#15803d" stroke-width="2.4" marker-end="url(#ok)"/>
<line x1="290" y1="430" x2="330" y2="443" stroke="#15803d" stroke-width="2.4" marker-end="url(#ok)"/>
<line x1="640" y1="430" x2="580" y2="435" stroke="#15803d" stroke-width="2.4" marker-end="url(#ok)"/>
<line x1="455" y1="400" x2="455" y2="350" stroke="#15803d" stroke-width="2.4" marker-end="url(#ok)"/>
<line x1="640" y1="412" x2="580" y2="224" stroke="#b91c1c" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#bad)"/>
<rect x="30" y="20" width="250" height="70" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="40" y="42" font-size="14" font-weight="bold" fill="#7c3aed">Phone / PC anywhere</text>
<text x="40" y="62" font-size="12" fill="#344054">DMSS / Hik-Connect / XMeye app</text>
<text x="40" y="78" font-size="12" fill="#344054">live view, playback, download</text>
<rect x="330" y="20" width="250" height="70" rx="9" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="340" y="42" font-size="14" font-weight="bold" fill="#0369a1">Internet - 100 Mbps</text>
<text x="340" y="62" font-size="12" fill="#344054">maker's cloud relay (P2P)</text>
<text x="340" y="78" font-size="12" fill="#344054">no open port, no port-forward</text>
<rect x="330" y="150" width="250" height="86" rx="9" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="340" y="172" font-size="14" font-weight="bold" fill="#1d4ed8">Router (MikroTik)</text>
<text x="340" y="192" font-size="12" fill="#344054">NVR / DVR: 10 Mbps kept for remote view</text>
<text x="340" y="208" font-size="12" fill="#344054">cameras: internet BLOCKED</text>
<text x="340" y="224" font-size="12" fill="#344054">port-forwards to CCTV: closed</text>
<rect x="330" y="290" width="250" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="340" y="312" font-size="14" font-weight="bold" fill="#64748b">Office switch</text>
<text x="340" y="332" font-size="12" fill="#344054">office PCs, mobiles, Wi-Fi</text>
<text x="340" y="348" font-size="12" fill="#344054">17 PCs, 9 mobiles online</text>
<rect x="30" y="400" width="260" height="86" rx="9" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="40" y="422" font-size="14" font-weight="bold" fill="#15803d">NVR / DVR (2)</text>
<text x="40" y="442" font-size="12" fill="#344054">records all cameras</text>
<text x="40" y="458" font-size="12" fill="#344054">talks to the cloud (outbound only)</text>
<text x="40" y="474" font-size="12" fill="#344054">USB export = emergency copy</text>
<rect x="330" y="400" width="250" height="60" rx="9" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="340" y="422" font-size="14" font-weight="bold" fill="#64748b">CCTV / PoE switches</text>
<text x="340" y="442" font-size="12" fill="#344054">cameras and recorders</text>
<text x="340" y="458" font-size="12" fill="#344054">stay on the local network</text>
<rect x="640" y="400" width="230" height="70" rx="9" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="650" y="422" font-size="14" font-weight="bold" fill="#b45309">34 CCTV cameras</text>
<text x="650" y="442" font-size="12" fill="#344054">send video only to the NVR / DVR</text>
<text x="650" y="458" font-size="12" fill="#344054">fixed IP list, saved on the router</text>
<rect x="406" y="110" width="98" height="20" rx="4" fill="#ffffff"/>
<text x="455" y="124" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">100 Mbps line</text>
<rect x="218" y="365" width="184" height="20" rx="4" fill="#ffffff"/>
<text x="310" y="379" font-size="12" font-weight="bold" fill="#15803d" text-anchor="middle">view on the office network</text>
<rect x="580" y="346" width="85" height="20" rx="4" fill="#ffffff"/>
<text x="622" y="360" font-size="12" font-weight="bold" fill="#b91c1c" text-anchor="middle">NO INTERNET</text>
<text x="30" y="534" font-size="12" fill="#475467">Green = allowed. Red dashed = blocked on the router.</text>
<text x="30" y="552" font-size="12" fill="#475467">Check cameras from anywhere in the NVR / DVR app. In an emergency: app &gt; Playback &gt; Download, or copy to a USB stick at the NVR.</text>
</svg>